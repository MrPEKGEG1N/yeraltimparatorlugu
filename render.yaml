services:
  - type: web
    name: yeralti-game
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/MrPEKGEG1N/yeraltimparatorlugu
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: yeralti-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PERSISTENT_DATA_PATH
        value: /data
      - key: ADMIN_USERNAME
        value: mrpekgeg1n
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://pzkafimfxuspoeybrywx.supabase.co
      - key: KUMARHANE_PIYANGO
        value: "1"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
