# Render ucretsiz planda ~15 dk islem yoksa uyur; dis ping ile 7/24 uyanik tutulur.
# Not: GitHub schedule cron bazen gecikir; */4 ile ortalama bosluk <15 dk tutulur.
name: Keep server alive

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          BASE="${KEEP_ALIVE_URL:-https://yeralti-game.onrender.com}"
          echo "Pinging ${BASE}"
          for i in 1 2 3; do
            if curl -fsS -m 90 "${BASE}/api/ping" || curl -fsS -m 90 "${BASE}/api/health"; then
              echo ""
              echo "OK"
              exit 0
            fi
            echo "Retry ${i}..."
            sleep 20
          done
          echo "Ping failed after retries"
          exit 1
