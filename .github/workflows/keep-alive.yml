# Render ücretsiz: ~15 dk inbound yoksa uyur.
# GitHub schedule gecikebilir → sık/offset cron + ikinci workflow yedegi.
name: Keep server alive

on:
  push:
    branches: [main, deploy]
  schedule:
    # Her 5 dk + 2 dk offset (yogunlukta bile bosluk < 15 dk tutulmaya calisilir)
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping production (cold-start safe)
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          BASE="${KEEP_ALIVE_URL:-https://yeralti-game.onrender.com}"
          BASE="${BASE%/}"
          echo "Pinging ${BASE}"
          for i in $(seq 1 12); do
            for path in /api/ping /api/health; do
              code=$(curl -sS -o /tmp/ka-body.txt -w "%{http_code}" -m 95 \
                -H "Cache-Control: no-store" \
                -H "User-Agent: yeralti-gh-keepalive/1" \
                "${BASE}${path}" || echo "000")
              echo "try ${i} ${path} -> HTTP ${code}"
              if [ "$code" = "200" ]; then
                head -c 200 /tmp/ka-body.txt || true
                echo ""
                echo "OK"
                exit 0
              fi
            done
            echo "Retry ${i}/12 in 15s..."
            sleep 15
          done
          echo "Ping failed after retries"
          exit 1
